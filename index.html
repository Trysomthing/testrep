<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Countdown</title>
<style>
  :root{
    --bg-1:#0a0118;
    --bg-2:#1a0538;
    --accent-1:#a855f7;
    --accent-2:#ec4899;
    --accent-3:#38bdf8;
    --text:#f5f3ff;
    --muted:#b9a9d6;
    /* Fixed sticker-outline ink, independent of theme/custom color — every
       accent color in the app is light/mid enough for this dark ink to
       stay readable against it. */
    --ink:#140a24;
    --shadow-x:4px;
    --shadow-y:4px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ color-scheme:dark; }

  html,body{
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
  }

  body{
    font-family:'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background:linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    position:relative;
  }

  /* Small flat sticker shapes drifting in the background — no blur, no glow,
     just confetti-like bits consistent with the sticker illustration style. */
  .orb{
    position:absolute;
    pointer-events:none;
    opacity:0.5;
    border:3px solid var(--ink);
    animation:float 18s ease-in-out infinite;
  }
  .orb1{
    width:46px; height:46px;
    border-radius:50%;
    background:var(--accent-1);
    top:64px; left:-14px;
    animation-delay:0s;
  }
  .orb2{
    width:36px; height:36px;
    border-radius:10px;
    background:var(--accent-3);
    bottom:90px; right:-10px;
    animation-delay:-6s;
  }
  .orb3{
    width:28px; height:28px;
    border-radius:50%;
    background:var(--accent-2);
    top:38%; right:6%;
    animation-delay:-12s;
  }

  @keyframes float{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    33%{ transform:translate(14px,-18px) rotate(12deg); }
    66%{ transform:translate(-10px,12px) rotate(-8deg); }
  }

  /* A memorial isn't the place for bouncing illustrations or scattered
     confetti bits — keep the sticker-outline look, drop the playfulness. */
  body[data-theme="memorial"] .orb{ animation:none; opacity:0.2; }
  body[data-theme="memorial"] .hug{ animation:none; }

  /* As an event gets closer, the sticker bits and extra stars become more active */
  body.time-mid .orb{ opacity:0.75; }
  body.time-close .orb{ opacity:1; }
  body.time-close .stars{ opacity:0.9; }

  .extra-stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity .8s ease;
  }
  body.time-close .extra-stars{ opacity:1; }
  .extra-stars span{
    position:absolute;
    width:3px;
    height:3px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 6px 1px rgba(255,255,255,0.8);
    animation:twinkle 2.2s ease-in-out infinite;
  }
  .extra-stars span:nth-child(2){ animation-delay:.4s; }
  .extra-stars span:nth-child(3){ animation-delay:.8s; }
  .extra-stars span:nth-child(4){ animation-delay:1.2s; }
  .extra-stars span:nth-child(5){ animation-delay:1.6s; }
  @keyframes twinkle{
    0%,100%{ opacity:0.3; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.6); }
  }

  .confetti-container{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:60;
  }
  .confetti-piece{
    position:absolute;
    top:-10px;
    width:8px;
    height:14px;
    border-radius:2px;
    opacity:0.9;
    animation:confetti-fall 2.4s ease-in forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg); opacity:0; }
  }

  /* Decoration motifs layered onto the illustration as milestones complete */
  .decor{ opacity:0; transition:opacity .6s ease; }
  .decor-in{ opacity:1; }

  /* subtle starfield */
  .stars{
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 140px 80px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 90px 160px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 220px 40px, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 260px 190px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 320px 120px, rgba(255,255,255,0.4), transparent);
    background-repeat:repeat;
    background-size:360px 220px;
    opacity:0.6;
    pointer-events:none;
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:920px;
    padding:32px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(24px, 5vw, 48px);
    text-align:center;
  }

  .hug{
    width:clamp(120px, 22vw, 190px);
    filter:drop-shadow(4px 4px 0 var(--ink));
    animation:bob 6s ease-in-out infinite;
  }

  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-1deg); }
    50%{ transform:translateY(-8px) rotate(1deg); }
  }

  .heart{
    transform-origin:120px 52px;
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.14); }
  }

  .eyebrow{
    display:inline-block;
    letter-spacing:0.1em;
    text-transform:uppercase;
    font-size:clamp(11px, 1.6vw, 13px);
    font-weight:800;
    color:var(--ink);
    background:var(--accent-3);
    border:3px solid var(--ink);
    border-radius:999px;
    padding:5px 16px;
    transform:rotate(-2deg);
  }

  h1{
    font-size:clamp(28px, 5.5vw, 56px);
    font-weight:900;
    line-height:1.12;
    color:var(--text);
    text-shadow:3px 3px 0 var(--ink);
    letter-spacing:-0.01em;
  }

  .subdate{
    color:var(--muted);
    font-size:clamp(13px, 2vw, 16px);
    font-weight:700;
  }
  .subdate span{
    color:var(--text);
    font-weight:800;
  }

  .location-line{
    display:none;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:var(--muted);
    font-size:clamp(12px, 1.8vw, 14px);
    font-weight:700;
    text-decoration:none;
    transition:color .15s ease;
  }
  .location-line.has-location{ display:inline-flex; }
  .location-line:hover{ color:var(--text); }
  .location-line svg{ width:14px; height:14px; flex-shrink:0; }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:clamp(10px, 2.4vw, 22px);
    width:100%;
    transition:grid-template-columns .35s ease;
  }

  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:var(--accent-1);
    border:3px solid var(--ink);
    border-radius:clamp(16px, 2.5vw, 26px);
    padding:clamp(10px, 2.4vw, 20px) clamp(4px, 1.6vw, 8px);
    box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--ink);
    transition:transform .2s ease, box-shadow .2s ease, padding .35s ease, background .3s ease;
  }
  .card:nth-child(2){ background:var(--accent-2); }
  .card:nth-child(3){ background:var(--accent-3); }
  .card:nth-child(4){ background:var(--accent-1); }

  .card.emphasized{
    padding:clamp(16px, 3.8vw, 34px) clamp(6px, 2.2vw, 12px);
  }

  .card:hover{
    transform:translate(2px, 2px);
    box-shadow:2px 2px 0 var(--ink);
  }

  .num{
    font-size:clamp(22px, 5.5vw, 44px);
    font-weight:900;
    font-variant-numeric:tabular-nums;
    line-height:1;
    color:var(--ink);
    display:inline-block;
    min-width:1.6ch;
    transition:font-size .3s ease, opacity .3s ease;
    opacity:0.6;
  }

  .num.big{
    font-size:clamp(48px, 13.5vw, 112px);
    opacity:1;
  }

  .label{
    margin-top:clamp(4px,1.2vw,10px);
    font-size:clamp(9px, 1.8vw, 13px);
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.75;
    font-weight:800;
  }

  .colon-wrap{ display:none; }

  .progress-wrap{
    width:100%;
    max-width:520px;
    height:14px;
    border-radius:999px;
    background:var(--bg-2);
    overflow:hidden;
    border:3px solid var(--ink);
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:var(--accent-1);
    transition:width 1s linear;
  }

  .done{
    font-size:clamp(24px, 5vw, 44px);
    font-weight:900;
    color:var(--text);
    text-shadow:3px 3px 0 var(--ink);
    display:none;
  }

  .milestones{
    width:100%;
    max-width:420px;
    background:var(--bg-2);
    border:3px solid var(--ink);
    border-radius:18px;
    padding:14px 16px;
    box-shadow:4px 4px 0 var(--ink);
    text-align:left;
  }

  .milestones-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .milestones-title{
    font-size:11.5px;
    font-weight:800;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .milestones-count{
    font-size:12px;
    font-weight:800;
    color:var(--ink);
    background:var(--accent-3);
    border:2px solid var(--ink);
    padding:2px 9px;
    border-radius:999px;
    font-variant-numeric:tabular-nums;
  }

  .milestones-list{
    display:flex;
    flex-direction:column;
    gap:4px;
    max-height:180px;
    overflow-y:auto;
  }

  .milestone-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 4px;
    border-radius:8px;
    transition:background .15s ease;
  }
  .milestone-item:hover{ background:rgba(255,255,255,0.05); }
  .milestone-item:hover .milestone-delete{ opacity:0.6; }

  .milestone-check{
    flex-shrink:0;
    width:20px;
    height:20px;
    border-radius:6px;
    border:2px solid var(--muted);
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink);
    transition:background .2s ease, border-color .2s ease;
  }
  .milestone-item.completed .milestone-check{
    background:var(--accent-3);
    border-color:var(--ink);
  }
  .milestone-check svg{ width:13px; height:13px; }

  .milestone-main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:1px;
  }

  .milestone-label{
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .milestone-item.completed .milestone-label{
    color:var(--muted);
    text-decoration:line-through;
    text-decoration-color:rgba(185,169,214,0.5);
  }

  .milestone-due{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
  }
  .milestone-due.due-today{ color:#fde68a; }
  .milestone-due.overdue{ color:#fda4af; }
  .milestone-item.completed .milestone-due{
    color:var(--muted);
    opacity:0.7;
  }

  .milestone-delete{
    flex-shrink:0;
    opacity:0;
    width:18px;
    height:18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    line-height:1;
    color:var(--muted);
    cursor:pointer;
    transition:opacity .15s ease, background .15s ease, color .15s ease;
  }
  .milestone-delete:hover{ opacity:1 !important; background:rgba(255,255,255,0.15); color:var(--text); }

  .milestone-add-row{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .milestone-add-row input{
    padding:9px 12px;
    border-radius:9px;
    border:2px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.05);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
  }
  .milestone-add-row input[type="text"]{ flex:1; min-width:0; }
  .milestone-add-row input[type="date"]{
    flex:0 0 auto;
    width:132px;
    color-scheme:dark;
  }
  .milestone-add-row input::placeholder{ color:rgba(185,169,214,0.5); }
  .milestone-add-row input:focus{
    outline:none;
    border-color:var(--accent-3);
  }
  .milestone-add-btn,
  .milestone-add-cancel{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:9px;
    border:2px solid var(--ink);
    background:var(--accent-1);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .milestone-add-btn:hover,
  .milestone-add-cancel:hover{ box-shadow:2px 2px 0 var(--ink); transform:translate(-1px,-1px); }
  .milestone-add-btn svg,
  .milestone-add-cancel svg{ width:15px; height:15px; }
  .milestone-add-cancel{ background:transparent; color:var(--muted); border-color:rgba(255,255,255,0.25); }

  /* Quiet by default — just an icon + label, so the panel doesn't show
     empty input fields until you actually want to add something. */
  .milestone-add-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    padding:8px 14px;
    border-radius:999px;
    border:1.5px dashed rgba(255,255,255,0.3);
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .milestone-add-toggle:hover{ border-color:rgba(255,255,255,0.55); color:var(--text); }
  .milestone-add-toggle svg{ width:14px; height:14px; flex-shrink:0; }
  .milestone-add-toggle[hidden],
  .milestone-add-row[hidden]{ display:none; }

  .cal-wrap{
    position:relative;
  }

  .cal-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border:3px solid var(--ink);
    border-radius:999px;
    font-family:inherit;
    font-size:clamp(13px, 1.8vw, 15px);
    font-weight:800;
    letter-spacing:0.01em;
    color:var(--ink);
    background:var(--accent-1);
    cursor:pointer;
    box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cal-btn:hover{
    transform:translate(2px, 2px);
    box-shadow:2px 2px 0 var(--ink);
  }
  .cal-btn:active{ transform:translate(4px, 4px); box-shadow:0 0 0 var(--ink); }
  .cal-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .cal-menu{
    position:absolute;
    top:calc(100% + 12px);
    left:50%;
    transform:translateX(-50%) translateY(-6px);
    min-width:230px;
    background:var(--bg-2);
    border:3px solid var(--ink);
    border-radius:16px;
    box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--ink);
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:10;
  }
  .cal-menu.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }

  .cal-menu.flip-up{
    top:auto;
    bottom:calc(100% + 12px);
    transform:translateX(-50%) translateY(6px);
  }
  .cal-menu.flip-up.open{
    transform:translateX(-50%) translateY(0);
  }

  .cal-option{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:11px 14px;
    border:none;
    border-radius:10px;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    text-align:left;
    text-decoration:none;
    cursor:pointer;
    transition:background .15s ease;
  }
  .cal-option:hover{ background:color-mix(in srgb, var(--accent-1) 25%, transparent); }
  .cal-option svg{ width:16px; height:16px; flex-shrink:0; color:var(--muted); }

  .cal-divider{
    height:2px;
    margin:4px 6px;
    background:rgba(255,255,255,0.14);
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(12px);
    max-width:min(90vw, 360px);
    padding:12px 18px;
    background:var(--bg-2);
    border:3px solid var(--ink);
    border-radius:12px;
    box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--ink);
    color:var(--text);
    font-size:13.5px;
    font-weight:700;
    text-align:center;
    line-height:1.4;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .export-wrap{
    position:relative;
  }

  .export-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border:3px solid var(--ink);
    border-radius:999px;
    font-family:inherit;
    font-size:clamp(13px, 1.8vw, 15px);
    font-weight:800;
    letter-spacing:0.01em;
    color:var(--ink);
    background:var(--text);
    cursor:pointer;
    box-shadow:var(--shadow-x) var(--shadow-y) 0 var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .export-btn:hover{
    transform:translate(2px, 2px);
    box-shadow:2px 2px 0 var(--ink);
  }
  .export-btn:active{ transform:translate(4px, 4px); box-shadow:0 0 0 var(--ink); }
  .export-btn:disabled{ opacity:0.6; cursor:wait; transform:none; }
  .export-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .cta-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  /* A single trigger showing the active event, opening a grouped list —
     replaces a horizontal chip row that got busy with more than a
     handful of events. */
  .events-dropdown{
    position:relative;
    width:100%;
    max-width:420px;
  }

  .events-trigger{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px 10px 18px;
    border-radius:999px;
    border:2px solid var(--ink);
    background:var(--accent-1);
    color:var(--ink);
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .events-trigger:hover{ transform:translate(1px, 1px); box-shadow:1px 1px 0 var(--ink); }
  .events-trigger-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .events-trigger-chevron{
    width:16px;
    height:16px;
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .events-trigger[aria-expanded="true"] .events-trigger-chevron{ transform:rotate(180deg); }

  .events-panel{
    position:absolute;
    top:calc(100% + 10px);
    left:0;
    right:0;
    background:var(--bg-2);
    border:3px solid var(--ink);
    border-radius:18px;
    box-shadow:4px 4px 0 var(--ink);
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    opacity:0;
    pointer-events:none;
    transform:translateY(-6px);
    transition:opacity .15s ease, transform .15s ease;
    z-index:20;
    max-height:min(420px, 60vh);
  }
  .events-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }

  .events-panel-add{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:9px 14px;
    border-radius:999px;
    border:2px dashed rgba(255,255,255,0.3);
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .events-panel-add:hover{ border-color:rgba(255,255,255,0.6); }
  .events-panel-add svg{ width:14px; height:14px; }

  .events-panel-list{
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .events-group-label{
    font-size:10.5px;
    font-weight:800;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);

  /* Freeze every transition/animation during export: the hand-drawn ink
     borders/shadows added afterward on the canvas are measured from the

  .exporting,

<script>
  // ---- Multiple events, persisted in this browser ----
  const STORAGE_EVENTS = 'countdown_events_v1';
  const STORAGE_ACTIVE = 'countdown_active_id_v1';
  const EVENT_DURATION_HOURS = 1;

  function defaultEvents(){
    return [{
      id: 'seed-1',
      title: 'Only 16 KM away',
      date: new Date(2026, 9, 3, 21, 10, 0).toISOString(),
      createdAt: new Date(2026, 8, 20, 0, 0, 0).toISOString(),
      location: '',
      description: 'Countdown event, created from the countdown page.',
      customColor: '#fb7185',
      milestones: [
        { id: 'm-seed-1', title: 'Book the venue', completed: true, dueDate: '2026-09-01' },
        { id: 'm-seed-2', title: 'Send invitations', completed: true, dueDate: '2026-09-15' },
        { id: 'm-seed-3', title: 'Final dress fitting', completed: false, dueDate: '2026-09-28' },
        { id: 'm-seed-4', title: 'Rehearsal dinner', completed: false, dueDate: '2026-10-02' },
      ],
    }];
  }

  function loadEvents(){
    try {
      const raw = localStorage.getItem(STORAGE_EVENTS);
      const parsed = raw ? JSON.parse(raw) : null;
      if (Array.isArray(parsed) && parsed.length) return parsed;
    } catch (err){ /* fall through to defaults */ }
    return defaultEvents();
  }

  function saveEvents(){
    localStorage.setItem(STORAGE_EVENTS, JSON.stringify(events));
  }

  let events = loadEvents();
  let activeId = localStorage.getItem(STORAGE_ACTIVE) || events[0].id;
  if (!events.some((e) => e.id === activeId)) activeId = events[0].id;

  function setActiveId(id){
    activeId = id;
    localStorage.setItem(STORAGE_ACTIVE, activeId);
  }

  function getActiveEvent(){
    return events.find((e) => e.id === activeId) || events[0];
  }

  const els = {
    title: document.getElementById('title'),
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
    grid: document.getElementById('grid'),
    done: document.getElementById('doneMsg'),
    progress: document.getElementById('progressBar'),
    targetLabel: document.getElementById('targetLabel'),
    locationLine: document.getElementById('locationLine'),
    locationLineText: document.getElementById('locationLineText'),
  };

  function pad2(n){ return String(n).padStart(2, '0'); }

  // Highlights whichever unit (days/hours/minutes/seconds) is the largest
  // one still counting down, e.g. once days hits 0 hours becomes the hero.
  const emphasisTargets = [els.days, els.hours, els.minutes, els.seconds];
  let lastEmphasizedIndex = -1;

  function setEmphasis(index){
    if (index === lastEmphasizedIndex) return;
    lastEmphasizedIndex = index;
    emphasisTargets.forEach((el, i) => {
      const isEmphasized = i === index;
      el.classList.toggle('big', isEmphasized);
      el.parentElement.classList.toggle('emphasized', isEmphasized);
    });
    els.grid.style.gridTemplateColumns = emphasisTargets
      .map((_, i) => (i === index ? '1.9fr' : '1fr'))
      .join(' ');
  }

  function toCalDateString(d){

  const THEME_PRIORITY = ['memorial', 'birthday', 'travel', 'work', 'love'];

  function pickTheme(title){
    const lower = (title || '').toLowerCase();
    for (const key of THEME_PRIORITY){
      if (THEMES[key].keywords.some((kw) => lower.includes(kw))) return THEMES[key];
    }
    return THEMES.generic;
  }

  // ---- Deriving a full palette from one manually picked color ----
  function hexToHsl(hex){
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0;
    const l = (max + min) / 2;
    const d = max - min;
    if (d !== 0){
      s = d / (1 - Math.abs(2 * l - 1));
      switch (max){
        case r: h = ((g - b) / d) % 6; break;
        case g: h = (b - r) / d + 2; break;
        default: h = (r - g) / d + 4; break;
      }
      h *= 60;
      if (h < 0) h += 360;
    }
    return { h, s: s * 100, l: l * 100 };
  }

  function hslToHex(h, s, l){
    h = ((h % 360) + 360) % 360;
    s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60){ r = c; g = x; }
    else if (h < 120){ r = x; g = c; }
    else if (h < 180){ g = c; b = x; }
    else if (h < 240){ g = x; b = c; }
    else if (h < 300){ r = x; b = c; }
    else { r = c; b = x; }
    const toHex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
  }

  function deriveTriadFromColor(hex){
    // Mirrors the spread of the original hand-picked palette (purple/pink/blue,
    // roughly +55°/-70° apart) rather than a harsh 120° primary-color triad.
    const { h, s, l } = hexToHsl(hex);
    const sat = Math.min(90, Math.max(55, s));
    const light = Math.min(72, Math.max(50, l));
    return {
      a1: hex,
      a2: hslToHex(h + 55, sat, Math.min(78, light + 6)),
      a3: hslToHex(h - 70, sat * 0.9, Math.min(75, light + 3)),
    };
  }

  function deriveBgFromColor(hex){
    const { h } = hexToHsl(hex);
    return {
      bg1: hslToHex(h, 55, 6),
      bg2: hslToHex(h + 15, 50, 12),
    };
  }

  function applyTheme(theme, customColor){
    const colors = customColor ? deriveTriadFromColor(customColor) : theme.colors;
    const bg = customColor ? deriveBgFromColor(customColor) : theme.bg;
    const root = document.documentElement.style;
    root.setProperty('--accent-1', colors.a1);
    root.setProperty('--accent-2', colors.a2);
    root.setProperty('--accent-3', colors.a3);
    root.setProperty('--bg-1', bg.bg1);
    root.setProperty('--bg-2', bg.bg2);
    document.getElementById('hugSvg').innerHTML = theme.svg;

    // The bold/bouncy sticker styling (confetti, bob animation, scattered
    // floating bits) is right for most events but not a memorial — mark it
    // on <body> so that one theme can opt out of the playful motion.
    const themeKey = Object.keys(THEMES).find((k) => THEMES[k] === theme) || 'generic';
    document.body.dataset.theme = themeKey;
  }

  // ---- Gamification: the illustration reflects real progress ----
  // Two independent layers, both computed from data already on the event —
  // no extra storage needed. (1) Milestone completion adds small decorative
  // motifs onto the illustration. (2) Time remaining shifts the ambient glow
  // and, at zero, fires a confetti burst.

  function getMilestones(ev){ return (ev && ev.milestones) || []; }

  function milestoneProgress(ev){
    const list = getMilestones(ev);
    if (!list.length) return 0;
    return list.filter((m) => m.completed).length / list.length;
  }

  function sparkleMotifSvg(cx, cy){
    return `<g class="decor">
      <path d="M${cx},${cy - 9} L${cx + 2.5},${cy - 2.5} L${cx + 9},${cy} L${cx + 2.5},${cy + 2.5} L${cx},${cy + 9} L${cx - 2.5},${cy + 2.5} L${cx - 9},${cy} L${cx - 2.5},${cy - 2.5} Z" fill="var(--accent-3)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${cx + 14}" cy="${cy + 10}" r="2" fill="var(--accent-2)" stroke="var(--ink)" stroke-width="1.5"/>
    </g>`;
  }

  function flowerMotifSvg(cx, cy){
    return `<g class="decor">
      <circle cx="${cx}" cy="${cy - 6}" r="4.5" fill="var(--accent-2)" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="${cx - 6}" cy="${cy}" r="4.5" fill="var(--accent-2)" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="${cx + 6}" cy="${cy}" r="4.5" fill="var(--accent-2)" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy + 6}" r="4.5" fill="var(--accent-2)" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--accent-3)" stroke="var(--ink)" stroke-width="2"/>
    </g>`;
  }

  function ringMotifSvg(){
    return `<g class="decor">
      <circle cx="120" cy="110" r="100" fill="none" stroke="var(--ink)" stroke-width="5" opacity="0.6"/>
    </g>`;
  }

  function renderDecorations(ev){
    const svg = document.getElementById('hugSvg');
    const old = svg.querySelector('#milestoneDecor');
    if (old) old.remove();

    if (!getMilestones(ev).length) return;
    const pct = milestoneProgress(ev);

    let html = '';
    if (pct >= 0.25) html += sparkleMotifSvg(38, 46);
    if (pct >= 0.5) html += flowerMotifSvg(34, 184);
    if (pct >= 0.75) html += flowerMotifSvg(206, 184);
    if (pct >= 1) html += ringMotifSvg();
    if (!html) return;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('id', 'milestoneDecor');
    g.innerHTML = html;
    svg.appendChild(g);

    requestAnimationFrame(() => {
      g.querySelectorAll('.decor').forEach((el) => el.classList.add('decor-in'));
    });
  }

  let lastTimeStage = null;
  function setTimeStage(stage){
    if (stage === lastTimeStage) return;
    lastTimeStage = stage;
    document.body.classList.remove('time-early', 'time-mid', 'time-close');
    document.body.classList.add(stage);
  }

  function fireConfetti(){
    const colors = ['var(--accent-1)', 'var(--accent-2)', 'var(--accent-3)', '#ffffff'];
    const container = document.createElement('div');
    container.className = 'confetti-container';
    for (let i = 0; i < 24; i++){
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      container.appendChild(piece);
    }
    document.body.appendChild(container);
    setTimeout(() => container.remove(), 3000);
  }

  // Populated by applyActiveEvent() and read by the calendar/share actions below.
  let currentEvent = null;
  let currentTargetDate = null;
  let currentEndDate = null;
  let timer = null;

  function applyActiveEvent(){
    const ev = getActiveEvent();
    const targetDate = new Date(ev.date);
    const startDate = new Date(ev.createdAt);
    const endDate = new Date(targetDate.getTime() + EVENT_DURATION_HOURS * 3600 * 1000);

    const theme = pickTheme(ev.title);
    applyTheme(theme, ev.customColor);
    renderDecorations(ev);

    currentEvent = ev;
    currentTargetDate = targetDate;
    currentEndDate = endDate;

    closeMilestoneForm();
    renderMilestones();

    els.title.textContent = ev.title;
    document.title = `${ev.title} — Countdown`;
    els.targetLabel.textContent = targetDate.toLocaleString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

    if (ev.location){
      els.locationLineText.textContent = ev.location;
      els.locationLine.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.location)}`;
      els.locationLine.classList.add('has-location');
    } else {
      els.locationLine.classList.remove('has-location');
      els.locationLine.removeAttribute('href');
    }

    els.done.style.display = 'none';
    els.grid.style.opacity = '1';

    document.getElementById('googleCalLink').href =
      'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      `&text=${encodeURIComponent(ev.title)}` +
      `&dates=${toCalDateString(targetDate)}/${toCalDateString(endDate)}` +
      `&details=${encodeURIComponent(ev.description || '')}` +
      `&location=${encodeURIComponent(ev.location || '')}` +
      `&ctz=${encodeURIComponent(timeZone)}`;

    if (timer) clearInterval(timer);

    let confettiFired = false;

    function tick(){
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0){
        els.days.textContent = '00';
        els.hours.textContent = '00';
        els.minutes.textContent = '00';
        els.seconds.textContent = '00';
        els.progress.style.width = '100%';
        els.grid.style.opacity = '0.35';
        els.done.textContent = document.body.dataset.theme === 'memorial' ? 'The day is here' : "🎉 It's here!";
        els.done.style.display = 'block';
        setTimeStage('time-close');
        if (!confettiFired){
          confettiFired = true;
          if (document.body.dataset.theme !== 'memorial') fireConfetti();
        }
        clearInterval(timer);
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const d = Math.floor(totalSeconds / 86400);
      const h = Math.floor((totalSeconds % 86400) / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;

      els.days.textContent = pad2(d);
      els.hours.textContent = pad2(h);
      els.minutes.textContent = pad2(m);
      els.seconds.textContent = pad2(s);

      setEmphasis(d > 0 ? 0 : h > 0 ? 1 : m > 0 ? 2 : 3);

      const total = targetDate - startDate;
      const elapsed = now - startDate;
      const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
      els.progress.style.width = pct + '%';

      const ratio = total > 0 ? elapsed / total : 1;
      setTimeStage(ratio >= 0.85 ? 'time-close' : ratio >= 0.5 ? 'time-mid' : 'time-early');
    }

    tick();
    timer = setInterval(tick, 1000);
  }

  // ---- Events menu: switch, add, delete, grouped by how soon they are ----
  const eventsTrigger = document.getElementById('eventsTrigger');
  const eventsTriggerLabel = document.getElementById('eventsTriggerLabel');
  const eventsPanel = document.getElementById('eventsPanel');
  const eventsPanelList = document.getElementById('eventsPanelList');
  const eventsPanelAddBtn = document.getElementById('eventsPanelAddBtn');

  function formatChipDate(iso){
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // Calendar-day distance (not a raw ms diff), so "today" and "this week"
  // group the way a person would expect regardless of the event's time of
  // day — consistent with how milestone due dates are grouped.
  function eventDaysUntil(iso){
    const target = new Date(iso);
    target.setHours(0, 0, 0, 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((target - today) / 86400000);
  }

  function renderEventsMenu(){
    const active = getActiveEvent();
    eventsTriggerLabel.textContent = `${active.title} · ${formatChipDate(active.date)}`;

    const past = [];
    const today = [];
    const thisWeek = [];
    const later = [];
    events.forEach((ev) => {
      const days = eventDaysUntil(ev.date);
      if (days < 0) past.push(ev);
      else if (days === 0) today.push(ev);
      else if (days <= 7) thisWeek.push(ev);
      else later.push(ev);
    });
    const byDateAsc = (a, b) => new Date(a.date) - new Date(b.date);
    const byDateDesc = (a, b) => new Date(b.date) - new Date(a.date);
    today.sort(byDateAsc);
    thisWeek.sort(byDateAsc);
    later.sort(byDateAsc);
    past.sort(byDateDesc);

    eventsPanelList.innerHTML = '';
    if (today.length) eventsPanelList.appendChild(buildEventGroup('Today', today));
    if (thisWeek.length) eventsPanelList.appendChild(buildEventGroup('This week', thisWeek));
    if (later.length) eventsPanelList.appendChild(buildEventGroup('Later', later));

  // Days left is computed from calendar dates only (not time-of-day), so

  function daysUntil(dueDateStr){
    const due = new Date(dueDateStr + 'T00:00:00');

  function formatMilestoneDue(m){

    const days = daysUntil(m.dueDate);
    if (days < 0) return { text: `${label} · ${Math.abs(days)}d overdue`, cls: 'overdue' };
    if (days === 0) return { text: `${label} · due today`, cls: 'due-today' };

  // ---- Export as Image / GIF ----
  // Renders the page (minus the buttons) to a canvas via an SVG foreignObject,
  // so exporting needs no external library or network access.

  function pageStyleText(){
    return document.querySelector('style').textContent;
  }

  // The theme/custom-color CSS variables are applied at runtime via
  // document.documentElement.style.setProperty(...) — i.e. on <html>, not
  // <body>. nodeToImage() only clones document.body, so without this, the
  // exported SVG's copy of the stylesheet only ever sees the *default*
  // :root values, not whichever theme is actually active. This re-declares
  // the live values so they win the cascade inside the clone.
  function liveCssVarsOverrideStyle(){
    const names = ['--accent-1', '--accent-2', '--accent-3', '--bg-1', '--bg-2'];
    const root = getComputedStyle(document.documentElement);
    const decls = names.map((name) => `${name}:${root.getPropertyValue(name).trim()};`).join('');
    return `:root{${decls}}`;
  }

  function nodeToImage(node){
    return new Promise((resolve, reject) => {
      const rect = node.getBoundingClientRect();
      const width = Math.ceil(rect.width);
      const height = Math.ceil(Math.max(rect.height, document.documentElement.scrollHeight));
      const clone = node.cloneNode(true);
      const html =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '">' +
          '<foreignObject width="100%" height="100%">' +
            '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + width + 'px;height:' + height + 'px;">' +
              '<style>' + pageStyleText() + liveCssVarsOverrideStyle() + '</style>' +
              new XMLSerializer().serializeToString(clone) +
            '</div>' +
          '</foreignObject>' +
        '</svg>';
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(html);
      const img = new Image();
      img.onload = () => resolve({ img, width, height });
      img.onerror = reject;
      img.src = url;
    });
  }

  // CSS border/box-shadow/text-shadow silently fail to rasterize through
  // the foreignObject-as-<img> pipeline above once the page is this
  // complex (verified: a hand-written minimal reproduction of the same
  // technique renders them fine; navigating directly to the generated SVG
  // also renders them fine; only decoding it as an <img> for canvas
  // drawImage drops them). Flat fills, text, and the illustration's own
  // native SVG stroke/fill all rasterize correctly — only CSS border and
  // the two shadow properties are affected. Since export hides everything
  // except the countdown tiles, the eyebrow badge, and the progress bar,
  // it's cheaper to redraw just those ink outlines/shadows natively on
  // the canvas afterward than to fight the underlying rendering bug.
  function roundRectPath(ctx, x, y, w, h, r){
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, radius);
    else {
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }
  }

  // Measures the frames to redraw *before* the base image is painted, so
  // the shadow can be laid down first (and then get mostly covered by the
  // tile drawn on top of it, leaving just the offset sliver visible — the
  // same effect CSS box-shadow would give), with the border stroke added
  // last on top of everything, since a stroke only outlines the edge and
  // never hides the tile's own content underneath it.
  function measureInkFrames(scale){
    const bodyRect = document.body.getBoundingClientRect();
    const root = getComputedStyle(document.documentElement);
    const ink = root.getPropertyValue('--ink').trim();
    const shadowX = (parseFloat(root.getPropertyValue('--shadow-x')) || 0) * scale;
    const shadowY = (parseFloat(root.getPropertyValue('--shadow-y')) || 0) * scale;

    const els = [
      ...Array.from(document.querySelectorAll('.card')).map((el) => ({ el, withShadow: true })),
      { el: document.querySelector('.eyebrow'), withShadow: false },
      { el: document.querySelector('.progress-wrap'), withShadow: false },
    ];

    return els
      .filter((f) => f.el)
      .map(({ el, withShadow }) => {
        const rect = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        const borderWidth = (parseFloat(cs.borderTopWidth) || 0) * scale;
        const radius = (parseFloat(cs.borderTopLeftRadius) || 0) * scale;
        return {
          ink, withShadow, borderWidth, radius, shadowX, shadowY,
          x: (rect.left - bodyRect.left) * scale,
          y: (rect.top - bodyRect.top) * scale,
          w: rect.width * scale,
          h: rect.height * scale,
        };
      })
      .filter((f) => f.borderWidth > 0);
  }

  function drawInkShadows(ctx, frames){
    frames.forEach((f) => {
      if (!f.withShadow) return;
      ctx.fillStyle = f.ink;
      roundRectPath(ctx, f.x + f.shadowX, f.y + f.shadowY, f.w, f.h, f.radius);
      ctx.fill();
    });
  }

  function drawInkBorders(ctx, frames){
    frames.forEach((f) => {
      ctx.lineWidth = f.borderWidth;
      ctx.strokeStyle = f.ink;
      roundRectPath(ctx, f.x + f.borderWidth / 2, f.y + f.borderWidth / 2, f.w - f.borderWidth, f.h - f.borderWidth, f.radius);
      ctx.stroke();
    });
  }

  async function captureToCanvas(scale){
    document.body.classList.add('exporting');
    try {
      const frames = measureInkFrames(scale);
      const { img, width, height } = await nodeToImage(document.body);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-1').trim() || '#160a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawInkShadows(ctx, frames);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      drawInkBorders(ctx, frames);
      return canvas;
    } finally {
      document.body.classList.remove('exporting');
    }
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function buildPngBlob(scale){
    return captureToCanvas(scale).then((canvas) =>
      new Promise((resolve) => canvas.toBlob(resolve, 'image/png'))
    );
  }

  async function exportAsPNG(){
    const blob = await buildPngBlob(2);
    downloadBlob(blob, 'countdown.png');
  }

  // ---- Toast feedback ----
  const toastEl = document.getElementById('toast');

  function showToast(message, ms){
    toastEl.textContent = message;

    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 3200);

  // ---- Copy Image to Clipboard ----
  async function copyImageToClipboard(){
    const blob = await buildPngBlob(2);
    if (navigator.clipboard && window.ClipboardItem){
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        return true;
      } catch (err){
        // fall through to download fallback below
      }
    }
    downloadBlob(blob, 'countdown.png');
    return false;
  }

  // ---- Share to another app (native share sheet when available) ----
  async function shareImage(){
    const blob = await buildPngBlob(2);
    const file = new File([blob], 'countdown.png', { type: 'image/png' });
    const shareData = {
      files: [file],
      title: currentEvent.title,
      text: `Countdown to ${currentEvent.title} — ${els.targetLabel.textContent}`,
    };

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share(shareData);
        return;
      } catch (err){
        if (err && err.name === 'AbortError') return; // user cancelled the share sheet
        // real failure: fall through to clipboard fallback
      }
    }

    const copied = await copyImageToClipboard();
    showToast(
      copied
        ? 'Sharing isn’t available in this browser — image copied. Paste it into WhatsApp, Telegram, or an email.'
        : 'Sharing isn’t available in this browser — image downloaded instead.'
    );
  }

  // -- Minimal self-contained GIF89a encoder --
  // Uses a fixed 256-color palette (3/3/2-bit RGB buckets) so every frame
  // quantizes deterministically, plus a standard dictionary-based LZW
  // encoder (GIF-flavored). No external library or network access needed.

  function buildGifPalette(){
    const palette = new Uint8Array(256 * 3);
    for (let r3 = 0; r3 < 8; r3++){
      for (let g3 = 0; g3 < 8; g3++){
        for (let b2 = 0; b2 < 4; b2++){
          const idx = (r3 << 5) | (g3 << 2) | b2;
          palette[idx * 3 + 0] = Math.min(255, r3 * 32 + 16);
          palette[idx * 3 + 1] = Math.min(255, g3 * 32 + 16);
          palette[idx * 3 + 2] = Math.min(255, b2 * 64 + 32);
        }
      }
    }
    return palette;
  }

  function quantizePixel(r, g, b){
    return ((r >> 5) << 5) | ((g >> 5) << 2) | (b >> 6);
  }

  class GifBitWriter{
    constructor(){ this.bytes = []; this.buffer = 0; this.bitCount = 0; }
    writeCode(code, size){
      this.buffer |= (code << this.bitCount);
      this.bitCount += size;
      while (this.bitCount >= 8){
        this.bytes.push(this.buffer & 0xFF);
        this.buffer >>= 8;
        this.bitCount -= 8;
      }
    }
    flush(){
      if (this.bitCount > 0){
        this.bytes.push(this.buffer & 0xFF);
        this.buffer = 0;
        this.bitCount = 0;
      }
    }
  }

  function lzwEncode(indices){
    // Standard dictionary-based GIF LZW encoder (8-bit palette codes).
    // Encoder and decoder build the identical dictionary from the same
    // rules, so the bitstream is self-synchronizing by construction.
    const CLEAR = 256, EOI = 257;
    const writer = new GifBitWriter();
    let codeSize, nextCode, dict;

    function resetDict(){
      dict = new Map();
      nextCode = 258;
      codeSize = 9;
    }

    resetDict();
    writer.writeCode(CLEAR, codeSize);

    let prefix = -1;
    for (let i = 0; i < indices.length; i++){
      const k = indices[i];
      if (prefix === -1){ prefix = k; continue; }

      const key = prefix * 256 + k;
      if (dict.has(key)){
        prefix = dict.get(key);
        continue;
      }

      writer.writeCode(prefix, codeSize);
      if (nextCode < 4096){
        dict.set(key, nextCode);
        nextCode++;
        if (nextCode > (1 << codeSize) && codeSize < 12){
          codeSize++;
        }
      } else {
        writer.writeCode(CLEAR, codeSize);
        resetDict();
      }
      prefix = k;
    }
    if (prefix !== -1) writer.writeCode(prefix, codeSize);
    writer.writeCode(EOI, codeSize);
    writer.flush();
    return writer.bytes;
  }

  function packSubBlocks(bytes){
    const out = [];
    let i = 0;
    while (i < bytes.length){
      const len = Math.min(255, bytes.length - i);
      out.push(len);
      for (let j = 0; j < len; j++) out.push(bytes[i + j]);
      i += len;
    }
    out.push(0);
    return out;
  }

  function buildGif(frames, delayCentiseconds){
    const width = frames[0].width, height = frames[0].height;
    const palette = buildGifPalette();
    const bytes = [];

    const pushStr = (s) => { for (let i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i)); };
    const push16 = (n) => { bytes.push(n & 0xFF, (n >> 8) & 0xFF); };

    pushStr('GIF89a');
    push16(width);
    push16(height);
    bytes.push(0xF7, 0, 0);
    for (let i = 0; i < palette.length; i++) bytes.push(palette[i]);

    bytes.push(0x21, 0xFF, 0x0B);
    pushStr('NETSCAPE2.0');
    bytes.push(0x03, 0x01, 0x00, 0x00, 0x00);

    for (const frame of frames){
      const indices = new Uint8Array(frame.width * frame.height);
      for (let p = 0; p < indices.length; p++){
        indices[p] = quantizePixel(frame.data[p * 4], frame.data[p * 4 + 1], frame.data[p * 4 + 2]);
      }

      bytes.push(0x21, 0xF9, 0x04, 0x00);
      push16(delayCentiseconds);
      bytes.push(0x00, 0x00);

      bytes.push(0x2C);
      push16(0); push16(0);
      push16(frame.width); push16(frame.height);
      bytes.push(0x00);

      bytes.push(8);
      const packed = packSubBlocks(lzwEncode(indices));
      for (const b of packed) bytes.push(b);
    }

    bytes.push(0x3B);
    return new Uint8Array(bytes);
  }

  async function captureGifFrames(frameCount, intervalMs, maxWidth){
    const frames = [];
    for (let i = 0; i < frameCount; i++){
      const canvas = await captureToCanvas(1);
      let source = canvas;
      if (canvas.width > maxWidth){
        const ratio = maxWidth / canvas.width;
        const small = document.createElement('canvas');
        small.width = maxWidth;
        small.height = Math.max(1, Math.round(canvas.height * ratio));
        small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
        source = small;
      }
      const ctx = source.getContext('2d');
      const data = ctx.getImageData(0, 0, source.width, source.height);
      frames.push({ data: data.data, width: source.width, height: source.height });
      if (i < frameCount - 1) await new Promise((r) => setTimeout(r, intervalMs));
    }
    return frames;
  }

  async function exportAsGIF(){
    const frames = await captureGifFrames(5, 450, 360);
    const gifBytes = buildGif(frames, 45);
    downloadBlob(new Blob([gifBytes], { type: 'image/gif' }), 'countdown.gif');
  }

  const exportBtn = document.getElementById('exportBtn');
  const exportMenu = document.getElementById('exportMenu');
  const exportBtnLabel = document.getElementById('exportBtnLabel');

  exportBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = exportMenu.classList.toggle('open');
    exportBtn.setAttribute('aria-expanded', String(isOpen));
    calMenu.classList.remove('open');
    if (isOpen) positionMenu(exportMenu);
  });

  exportMenu.addEventListener('click', (e) => e.stopPropagation());

  document.addEventListener('click', () => {
    exportMenu.classList.remove('open');
    exportBtn.setAttribute('aria-expanded', 'false');
  });

  calBtn.addEventListener('click', () => exportMenu.classList.remove('open'));

  async function withBusyExport(label, fn){
    exportMenu.classList.remove('open');
    exportBtn.disabled = true;
    const prevLabel = exportBtnLabel.textContent;
    exportBtnLabel.textContent = label;
    try {
      await fn();
    } finally {
      exportBtn.disabled = false;
      exportBtnLabel.textContent = prevLabel;
    }
  }

  document.getElementById('exportPngBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', exportAsPNG);
  });

  document.getElementById('exportGifBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', exportAsGIF);
  });

  document.getElementById('copyImageBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', async () => {
      const copied = await copyImageToClipboard();
      showToast(copied ? 'Image copied to clipboard.' : 'Clipboard unavailable — image downloaded instead.');
    });
  });

  document.getElementById('shareBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', shareImage);
  });
</script>
