<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Countdown</title>
<style>
  :root{
    --bg-1:#0a0118;
    --bg-2:#1a0538;
    --accent-1:#a855f7;
    --accent-2:#ec4899;
    --accent-3:#38bdf8;
    --text:#f5f3ff;
    --muted:#b9a9d6;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ color-scheme:dark; }

  html,body{
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
  }

  body{
    font-family:'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(ellipse at 20% 20%, color-mix(in srgb, var(--accent-1) 35%, transparent), transparent 55%),
      radial-gradient(ellipse at 80% 30%, color-mix(in srgb, var(--accent-2) 30%, transparent), transparent 55%),
      radial-gradient(ellipse at 50% 85%, color-mix(in srgb, var(--accent-3) 25%, transparent), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    position:relative;
  }

  /* floating orbs */
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.5;
    pointer-events:none;
    animation:float 18s ease-in-out infinite;
  }
  .orb1{
    width:340px; height:340px;
    background:var(--accent-1);
    top:-80px; left:-80px;
    animation-delay:0s;
  }
  .orb2{
    width:280px; height:280px;
    background:var(--accent-3);
    bottom:-60px; right:-60px;
    animation-delay:-6s;
  }
  .orb3{
    width:220px; height:220px;
    background:var(--accent-2);
    top:40%; right:10%;
    animation-delay:-12s;
  }

  @keyframes float{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(30px,-40px) scale(1.08); }
    66%{ transform:translate(-25px,25px) scale(0.95); }
  }

  /* subtle starfield */
  .stars{
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 140px 80px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 90px 160px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 220px 40px, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 260px 190px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 320px 120px, rgba(255,255,255,0.4), transparent);
    background-repeat:repeat;
    background-size:360px 220px;
    opacity:0.6;
    pointer-events:none;
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:920px;
    padding:32px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(24px, 5vw, 48px);
    text-align:center;
  }

  .hug{
    width:clamp(120px, 22vw, 190px);
    filter:drop-shadow(0 10px 26px rgba(236,72,153,0.35));
    animation:bob 6s ease-in-out infinite;
  }

  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .heart{
    transform-origin:120px 52px;
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.14); }
  }

  .eyebrow{
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:clamp(11px, 1.6vw, 13px);
    color:var(--muted);
    font-weight:600;
  }

  h1{
    font-size:clamp(28px, 5.5vw, 56px);
    font-weight:800;
    line-height:1.1;
    background:linear-gradient(90deg, #fff, var(--accent-3) 45%, var(--accent-2) 75%, var(--accent-1));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:-0.02em;
  }

  .subdate{
    color:var(--muted);
    font-size:clamp(13px, 2vw, 16px);
    font-weight:500;
  }
  .subdate span{
    color:var(--text);
    font-weight:700;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:clamp(10px, 2.4vw, 22px);
    width:100%;
    transition:grid-template-columns .35s ease;
  }

  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.055);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:clamp(16px, 2.5vw, 26px);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:clamp(10px, 2.4vw, 20px) clamp(4px, 1.6vw, 8px);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.15);
    overflow:hidden;
    transition:transform .4s ease, background .3s ease, border-color .3s ease, padding .35s ease;
  }

  .card.emphasized{
    background:rgba(255,255,255,0.095);
    border-color:rgba(255,255,255,0.3);
    padding:clamp(16px, 3.8vw, 34px) clamp(6px, 2.2vw, 12px);
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, rgba(255,255,255,0.12), transparent 40%);
    pointer-events:none;
  }

  .card:hover{ transform:translateY(-4px); }

  .num{
    font-size:clamp(22px, 5.5vw, 44px);
    font-weight:800;
    font-variant-numeric:tabular-nums;
    line-height:1;
    background:linear-gradient(180deg, #ffffff, var(--accent-3) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(168,85,247,0.35);
    display:inline-block;
    min-width:1.6ch;
    transition:font-size .3s ease, opacity .3s ease;
    opacity:0.75;
  }

  .num.big{
    font-size:clamp(48px, 13.5vw, 112px);
    opacity:1;
  }

  .label{
    margin-top:clamp(4px,1.2vw,10px);
    font-size:clamp(9px, 1.8vw, 13px);
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
  }

  .colon-wrap{ display:none; }

  .progress-wrap{
    width:100%;
    max-width:520px;
    height:6px;
    border-radius:999px;
    background:rgba(255,255,255,0.1);
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
  }
  .progress-bar{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent-1), var(--accent-3), var(--accent-2));
    background-size:200% 100%;
    animation:sheen 3s linear infinite;
    transition:width 1s linear;
  }
  @keyframes sheen{
    0%{ background-position:0% 0%; }
    100%{ background-position:200% 0%; }
  }

  .done{
    font-size:clamp(24px, 5vw, 44px);
    font-weight:800;
    background:linear-gradient(90deg, var(--accent-3), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    display:none;
  }

  .cal-wrap{
    position:relative;
  }

  .cal-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border:none;
    border-radius:999px;
    font-family:inherit;
    font-size:clamp(13px, 1.8vw, 15px);
    font-weight:700;
    letter-spacing:0.02em;
    color:#0a0118;
    background:linear-gradient(90deg, var(--accent-3), var(--accent-1), var(--accent-2));
    background-size:200% 100%;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(168,85,247,0.4);
    transition:transform .25s ease, box-shadow .25s ease, background-position .4s ease;
  }
  .cal-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 36px rgba(236,72,153,0.5);
    background-position:100% 0%;
  }
  .cal-btn:active{ transform:translateY(-1px); }
  .cal-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .cal-menu{
    position:absolute;
    top:calc(100% + 12px);
    left:50%;
    transform:translateX(-50%) translateY(-6px);
    min-width:230px;
    background:rgba(17,9,34,0.97);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:16px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 16px 40px rgba(0,0,0,0.45);
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:10;
  }
  .cal-menu.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }

  .cal-menu.flip-up{
    top:auto;
    bottom:calc(100% + 12px);
    transform:translateX(-50%) translateY(6px);
  }
  .cal-menu.flip-up.open{
    transform:translateX(-50%) translateY(0);
  }

  .cal-option{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:11px 14px;
    border:none;
    border-radius:10px;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    text-align:left;
    text-decoration:none;
    cursor:pointer;
    transition:background .15s ease;
  }
  .cal-option:hover{ background:rgba(255,255,255,0.09); }
  .cal-option svg{ width:16px; height:16px; flex-shrink:0; color:var(--muted); }

  .cal-divider{
    height:1px;
    margin:4px 6px;
    background:rgba(255,255,255,0.12);
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(12px);
    max-width:min(90vw, 360px);
    padding:12px 18px;
    background:rgba(20,10,40,0.92);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:12px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 16px 40px rgba(0,0,0,0.45);
    color:var(--text);
    font-size:13.5px;
    font-weight:600;
    text-align:center;
    line-height:1.4;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .export-wrap{
    position:relative;
  }

  .export-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border:1px solid rgba(255,255,255,0.22);
    border-radius:999px;
    font-family:inherit;
    font-size:clamp(13px, 1.8vw, 15px);
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--text);
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    cursor:pointer;
    transition:transform .25s ease, background .25s ease;
  }
  .export-btn:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,0.14);
  }
  .export-btn:active{ transform:translateY(-1px); }
  .export-btn:disabled{ opacity:0.6; cursor:wait; transform:none; }
  .export-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .cta-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  .events-bar{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    overflow-x:auto;
    padding:2px 2px 6px;
  }
  .events-bar::-webkit-scrollbar{ height:6px; }
  .events-bar::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.2); border-radius:999px; }

  .event-chip{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 8px 9px 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.05);
    color:var(--muted);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .event-chip:hover{ background:rgba(255,255,255,0.1); }
  .event-chip.active{
    background:linear-gradient(90deg, rgba(168,85,247,0.4), rgba(56,189,248,0.32));
    border-color:rgba(255,255,255,0.4);
    color:var(--text);
  }

  .event-chip-date{
    opacity:0.75;
    font-weight:500;
    font-size:12px;
  }

  .event-chip-edit,
  .event-chip-delete{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:18px;
    height:18px;
    border-radius:50%;
    font-size:14px;
    line-height:1;
    opacity:0.5;
    transition:opacity .15s ease, background .15s ease;
  }
  .event-chip-edit:hover,
  .event-chip-delete:hover{ opacity:1; background:rgba(255,255,255,0.18); }
  .event-chip-edit svg{ width:11px; height:11px; }

  .add-event-btn{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:36px;
    padding:0 16px;
    border-radius:999px;
    border:1px dashed rgba(255,255,255,0.35);
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease;
  }
  .add-event-btn:hover{ background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.55); }
  .add-event-btn svg{ width:15px; height:15px; flex-shrink:0; }

  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(5,2,14,0.72);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:100;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }

  .modal-card{
    width:100%;
    max-width:400px;
    background:rgba(19,10,38,0.98);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:20px;
    padding:26px;
    box-shadow:0 24px 60px rgba(0,0,0,0.5);
    transform:translateY(14px) scale(0.98);
    transition:transform .25s ease;
    text-align:left;
  }
  .modal-backdrop.open .modal-card{ transform:translateY(0) scale(1); }

  .modal-card h2{
    font-size:20px;
    font-weight:800;
    margin-bottom:18px;
    background:linear-gradient(90deg, #fff, var(--accent-3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field label .optional{
    text-transform:none;
    font-weight:500;
    letter-spacing:0;
    opacity:0.7;
  }

  .field input, .field textarea{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    resize:none;
  }
  .field input::placeholder, .field textarea::placeholder{ color:rgba(185,169,214,0.5); }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--accent-3);
    box-shadow:0 0 0 3px rgba(56,189,248,0.25);
  }

  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; margin-bottom:14px; }

  .color-field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  label.checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    text-transform:none;
    letter-spacing:normal;
    margin-bottom:0;
    cursor:pointer;
  }
  .checkbox-label input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:var(--accent-3);
    cursor:pointer;
  }

  .color-field input[type="color"]{
    width:40px;
    height:36px;
    padding:2px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06);
    cursor:pointer;
    flex-shrink:0;
  }
  .color-field input[type="color"]:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  .form-error{
    color:#fda4af;
    font-size:13px;
    font-weight:600;
    min-height:18px;
    margin-bottom:2px;
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:8px;
  }
  .modal-btn{
    padding:10px 20px;
    border-radius:999px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    border:none;
  }
  .modal-btn.ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid rgba(255,255,255,0.18);
  }
  .modal-btn.ghost:hover{ background:rgba(255,255,255,0.08); }
  .modal-btn.primary{
    background:linear-gradient(90deg, var(--accent-3), var(--accent-1));
    color:#0a0118;
  }
  .modal-btn.primary:hover{ filter:brightness(1.08); }

  .exporting .cal-wrap,
  .exporting .export-wrap,
  .exporting footer,
  .exporting .toast,
  .exporting .events-bar,
  .exporting .modal-backdrop{
    visibility:hidden !important;
  }
  .exporting .card{
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    background:rgba(40,20,70,0.6) !important;
  }
  .exporting .cal-menu{
    display:none !important;
  }

  footer{
    position:absolute;
    bottom:16px;
    left:0; right:0;
    text-align:center;
    font-size:11px;
    color:rgba(185,169,214,0.55);
    letter-spacing:0.08em;
    z-index:2;
  }

  @media (max-width: 480px){
    .grid{ gap:8px; }
    .card{ border-radius:16px; }
  }

  @media (prefers-reduced-motion: reduce){
    .orb{ animation:none; }
    .progress-bar{ animation:none; }
    .hug{ animation:none; }
    .heart{ animation:none; }
  }
</style>
</head>
<body>

  <div class="stars"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="stage">
    <div class="events-bar" id="eventsBar"></div>

    <svg class="hug" id="hugSvg" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" aria-label="Illustration for this countdown">
      <defs>
        <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <linearGradient id="gradB" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ec4899"/>
          <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ec4899" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="120" cy="152" rx="98" ry="55" fill="url(#glow)"/>

      <!-- left figure -->
      <path d="M60,206 C54,150 59,118 78,107 C69,94 71,77 90,71 C96,67 109,70 113,85 C119,101 111,121 119,141 C127,159 121,182 119,206 Z" fill="url(#gradA)"/>
      <path d="M108,121 C121,112 139,113 149,123 C155,129 153,139 145,141 C132,144 116,137 108,129 Z" fill="url(#gradA)"/>
      <circle cx="95" cy="65" r="21" fill="url(#gradA)"/>

      <!-- right figure -->
      <path d="M180,206 C186,150 181,118 162,107 C171,94 169,77 150,71 C144,67 131,70 127,85 C121,101 129,121 121,141 C113,159 119,182 121,206 Z" fill="url(#gradB)"/>
      <path d="M132,121 C119,112 101,113 91,123 C85,129 87,139 95,141 C108,144 124,137 132,129 Z" fill="url(#gradB)"/>
      <circle cx="145" cy="65" r="21" fill="url(#gradB)"/>

      location: '',
      description: 'Countdown event, created from the countdown page.',
      customColor: null,
    }];

  function loadEvents(){
    try {
      const raw = localStorage.getItem(STORAGE_EVENTS);
      const parsed = raw ? JSON.parse(raw) : null;
      if (Array.isArray(parsed) && parsed.length) return parsed;
    } catch (err){ /* fall through to defaults */ }
    return defaultEvents();
  }

  function saveEvents(){
    localStorage.setItem(STORAGE_EVENTS, JSON.stringify(events));
  }

  let activeId = localStorage.getItem(STORAGE_ACTIVE) || events[0].id;

  function setActiveId(id){
    activeId = id;
    localStorage.setItem(STORAGE_ACTIVE, activeId);
  }

  function getActiveEvent(){
    return events.find((e) => e.id === activeId) || events[0];

  const emphasisTargets = [els.days, els.hours, els.minutes, els.seconds];

  function setEmphasis(index){
    if (index === lastEmphasizedIndex) return;
    lastEmphasizedIndex = index;
    emphasisTargets.forEach((el, i) => {

      el.classList.toggle('big', isEmphasized);

  const THEME_PRIORITY = ['memorial', 'birthday', 'travel', 'work', 'love'];

  function pickTheme(title){
    const lower = (title || '').toLowerCase();

    }

  // ---- Deriving a full palette from one manually picked color ----
  function hexToHsl(hex){
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0, s = 0;
    const l = (max + min) / 2;
    const d = max - min;
    if (d !== 0){
      s = d / (1 - Math.abs(2 * l - 1));
      switch (max){
        case r: h = ((g - b) / d) % 6; break;
        case g: h = (b - r) / d + 2; break;
        default: h = (r - g) / d + 4; break;
      }
      h *= 60;
      if (h < 0) h += 360;
    }
    return { h, s: s * 100, l: l * 100 };
  }

  function hslToHex(h, s, l){
    h = ((h % 360) + 360) % 360;
    s /= 100; l /= 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60){ r = c; g = x; }
    else if (h < 120){ r = x; g = c; }
    else if (h < 180){ g = c; b = x; }
    else if (h < 240){ g = x; b = c; }
    else if (h < 300){ r = x; b = c; }
    else { r = c; b = x; }
    const toHex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
  }

  function deriveTriadFromColor(hex){
    // Mirrors the spread of the original hand-picked palette (purple/pink/blue,
    // roughly +55°/-70° apart) rather than a harsh 120° primary-color triad.
    const { h, s, l } = hexToHsl(hex);
    const sat = Math.min(90, Math.max(55, s));
    const light = Math.min(72, Math.max(50, l));
    return {
      a1: hex,
      a2: hslToHex(h + 55, sat, Math.min(78, light + 6)),
      a3: hslToHex(h - 70, sat * 0.9, Math.min(75, light + 3)),
    };
  }

  function deriveBgFromColor(hex){
    const { h } = hexToHsl(hex);
    return {
      bg1: hslToHex(h, 55, 6),
      bg2: hslToHex(h + 15, 50, 12),
    };
  }

  function applyTheme(theme, customColor){
    const colors = customColor ? deriveTriadFromColor(customColor) : theme.colors;
    const bg = customColor ? deriveBgFromColor(customColor) : theme.bg;
    const root = document.documentElement.style;
    root.setProperty('--accent-1', colors.a1);
    root.setProperty('--accent-2', colors.a2);
    root.setProperty('--accent-3', colors.a3);
    root.setProperty('--bg-1', bg.bg1);
    root.setProperty('--bg-2', bg.bg2);
    document.getElementById('hugSvg').innerHTML = theme.svg;
  }

  function applyActiveEvent(){
    const ev = getActiveEvent();
    const targetDate = new Date(ev.date);
    const startDate = new Date(ev.createdAt);
    const endDate = new Date(targetDate.getTime() + EVENT_DURATION_HOURS * 3600 * 1000);

    // The seed event keeps its original couple-hugging illustration regardless
    // of keyword matching — it's the flagship example, not user-generated content.
    const theme = ev.id === 'seed-1' ? THEMES.love : pickTheme(ev.title);
    applyTheme(theme, ev.customColor);

    currentEvent = ev;
    currentTargetDate = targetDate;
    currentEndDate = endDate;

    els.title.textContent = ev.title;
    document.title = `${ev.title} — Countdown`;
    els.targetLabel.textContent = targetDate.toLocaleString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
    els.done.style.display = 'none';
    els.grid.style.opacity = '1';

    document.getElementById('googleCalLink').href =
      'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      `&text=${encodeURIComponent(ev.title)}` +
      `&dates=${toCalDateString(targetDate)}/${toCalDateString(endDate)}` +
      `&details=${encodeURIComponent(ev.description || '')}` +
      `&location=${encodeURIComponent(ev.location || '')}` +
      `&ctz=${encodeURIComponent(timeZone)}`;

    if (timer) clearInterval(timer);

    function tick(){
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0){
        els.days.textContent = '00';
        els.hours.textContent = '00';
        els.minutes.textContent = '00';
        els.seconds.textContent = '00';
        els.progress.style.width = '100%';
        els.grid.style.opacity = '0.35';
        els.done.style.display = 'block';
        clearInterval(timer);
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const d = Math.floor(totalSeconds / 86400);
      const h = Math.floor((totalSeconds % 86400) / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;

      els.days.textContent = pad2(d);
      els.hours.textContent = pad2(h);
      els.minutes.textContent = pad2(m);
      els.seconds.textContent = pad2(s);

      setEmphasis(d > 0 ? 0 : h > 0 ? 1 : m > 0 ? 2 : 3);

      const total = targetDate - startDate;
      const elapsed = now - startDate;
      const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
      els.progress.style.width = pct + '%';
    }

    tick();
    timer = setInterval(tick, 1000);
  }

  // ---- Export as Image / GIF ----
  // Renders the page (minus the buttons) to a canvas via an SVG foreignObject,
  // so exporting needs no external library or network access.

  function pageStyleText(){
    return document.querySelector('style').textContent;
  }

  function nodeToImage(node){
    return new Promise((resolve, reject) => {
      const rect = node.getBoundingClientRect();
      const width = Math.ceil(rect.width);
      const height = Math.ceil(Math.max(rect.height, document.documentElement.scrollHeight));
      const clone = node.cloneNode(true);
      const html =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '">' +
          '<foreignObject width="100%" height="100%">' +
            '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + width + 'px;height:' + height + 'px;">' +
              '<style>' + pageStyleText() + '</style>' +
              new XMLSerializer().serializeToString(clone) +
            '</div>' +
          '</foreignObject>' +
        '</svg>';
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(html);
      const img = new Image();
      img.onload = () => resolve({ img, width, height });
      img.onerror = reject;
      img.src = url;
    });
  }

  async function captureToCanvas(scale){
    document.body.classList.add('exporting');
    try {
      const { img, width, height } = await nodeToImage(document.body);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#160a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas;
    } finally {
      document.body.classList.remove('exporting');
    }
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function buildPngBlob(scale){
    return captureToCanvas(scale).then((canvas) =>
      new Promise((resolve) => canvas.toBlob(resolve, 'image/png'))
    );
  }

  // -- Minimal self-contained GIF89a encoder --
  // Uses a fixed 256-color palette (3/3/2-bit RGB buckets) so every frame
  // quantizes deterministically, plus a standard dictionary-based LZW
  // encoder (GIF-flavored). No external library or network access needed.

  function buildGifPalette(){
    const palette = new Uint8Array(256 * 3);
    for (let r3 = 0; r3 < 8; r3++){
      for (let g3 = 0; g3 < 8; g3++){
        for (let b2 = 0; b2 < 4; b2++){
          const idx = (r3 << 5) | (g3 << 2) | b2;
          palette[idx * 3 + 0] = Math.min(255, r3 * 32 + 16);
          palette[idx * 3 + 1] = Math.min(255, g3 * 32 + 16);
          palette[idx * 3 + 2] = Math.min(255, b2 * 64 + 32);
        }
      }
    }
    return palette;
  }

  function quantizePixel(r, g, b){
    return ((r >> 5) << 5) | ((g >> 5) << 2) | (b >> 6);
  }

  class GifBitWriter{
    constructor(){ this.bytes = []; this.buffer = 0; this.bitCount = 0; }
    writeCode(code, size){
      this.buffer |= (code << this.bitCount);
      this.bitCount += size;
      while (this.bitCount >= 8){
        this.bytes.push(this.buffer & 0xFF);
        this.buffer >>= 8;
        this.bitCount -= 8;
      }
    }
    flush(){
      if (this.bitCount > 0){
        this.bytes.push(this.buffer & 0xFF);
        this.buffer = 0;
        this.bitCount = 0;
      }
    }
  }

  function lzwEncode(indices){
    // Standard dictionary-based GIF LZW encoder (8-bit palette codes).
    // Encoder and decoder build the identical dictionary from the same
    // rules, so the bitstream is self-synchronizing by construction.
    const CLEAR = 256, EOI = 257;
    const writer = new GifBitWriter();
    let codeSize, nextCode, dict;

    function resetDict(){
      dict = new Map();
      nextCode = 258;
      codeSize = 9;
    }

    resetDict();
    writer.writeCode(CLEAR, codeSize);

    let prefix = -1;
    for (let i = 0; i < indices.length; i++){
      const k = indices[i];
      if (prefix === -1){ prefix = k; continue; }

      const key = prefix * 256 + k;
      if (dict.has(key)){
        prefix = dict.get(key);
        continue;
      }

      writer.writeCode(prefix, codeSize);
      if (nextCode < 4096){
        dict.set(key, nextCode);
        nextCode++;
        if (nextCode > (1 << codeSize) && codeSize < 12){
          codeSize++;
        }
      } else {
        writer.writeCode(CLEAR, codeSize);
        resetDict();
      }
      prefix = k;
    }
    if (prefix !== -1) writer.writeCode(prefix, codeSize);
    writer.writeCode(EOI, codeSize);
    writer.flush();
    return writer.bytes;
  }

  function packSubBlocks(bytes){
    const out = [];
    let i = 0;
    while (i < bytes.length){
      const len = Math.min(255, bytes.length - i);
      out.push(len);
      for (let j = 0; j < len; j++) out.push(bytes[i + j]);
      i += len;
    }
    out.push(0);
    return out;
  }

  function buildGif(frames, delayCentiseconds){
    const width = frames[0].width, height = frames[0].height;
    const palette = buildGifPalette();
    const bytes = [];

    const pushStr = (s) => { for (let i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i)); };
    const push16 = (n) => { bytes.push(n & 0xFF, (n >> 8) & 0xFF); };

    pushStr('GIF89a');
    push16(width);
    push16(height);
    bytes.push(0xF7, 0, 0);
    for (let i = 0; i < palette.length; i++) bytes.push(palette[i]);

    bytes.push(0x21, 0xFF, 0x0B);
    pushStr('NETSCAPE2.0');
    bytes.push(0x03, 0x01, 0x00, 0x00, 0x00);

    for (const frame of frames){
      const indices = new Uint8Array(frame.width * frame.height);
      for (let p = 0; p < indices.length; p++){
        indices[p] = quantizePixel(frame.data[p * 4], frame.data[p * 4 + 1], frame.data[p * 4 + 2]);
      }

      bytes.push(0x21, 0xF9, 0x04, 0x00);
      push16(delayCentiseconds);
      bytes.push(0x00, 0x00);

      bytes.push(0x2C);
      push16(0); push16(0);
      push16(frame.width); push16(frame.height);
      bytes.push(0x00);

      bytes.push(8);
      const packed = packSubBlocks(lzwEncode(indices));
      for (const b of packed) bytes.push(b);
    }

    bytes.push(0x3B);
    return new Uint8Array(bytes);
  }

  async function captureGifFrames(frameCount, intervalMs, maxWidth){
    const frames = [];
    for (let i = 0; i < frameCount; i++){
      const canvas = await captureToCanvas(1);
      let source = canvas;
      if (canvas.width > maxWidth){
        const ratio = maxWidth / canvas.width;
        const small = document.createElement('canvas');
        small.width = maxWidth;
        small.height = Math.max(1, Math.round(canvas.height * ratio));
        small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
        source = small;
      }
      const ctx = source.getContext('2d');
      const data = ctx.getImageData(0, 0, source.width, source.height);
      frames.push({ data: data.data, width: source.width, height: source.height });
      if (i < frameCount - 1) await new Promise((r) => setTimeout(r, intervalMs));
    }
    return frames;
  }

  async function exportAsGIF(){
    const frames = await captureGifFrames(5, 450, 360);
    const gifBytes = buildGif(frames, 45);
    downloadBlob(new Blob([gifBytes], { type: 'image/gif' }), 'countdown.gif');
  }

  const exportBtn = document.getElementById('exportBtn');
  const exportMenu = document.getElementById('exportMenu');
  const exportBtnLabel = document.getElementById('exportBtnLabel');

  exportBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = exportMenu.classList.toggle('open');
    exportBtn.setAttribute('aria-expanded', String(isOpen));
    calMenu.classList.remove('open');
    if (isOpen) positionMenu(exportMenu);
  });

  exportMenu.addEventListener('click', (e) => e.stopPropagation());

  document.addEventListener('click', () => {
    exportMenu.classList.remove('open');
    exportBtn.setAttribute('aria-expanded', 'false');
  });

  calBtn.addEventListener('click', () => exportMenu.classList.remove('open'));

  async function withBusyExport(label, fn){
    exportMenu.classList.remove('open');
    exportBtn.disabled = true;
    const prevLabel = exportBtnLabel.textContent;
    exportBtnLabel.textContent = label;
    try {
      await fn();
    } finally {
      exportBtn.disabled = false;
      exportBtnLabel.textContent = prevLabel;
    }
  }

  document.getElementById('exportPngBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', exportAsPNG);
  });

  document.getElementById('exportGifBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', exportAsGIF);
  });

  document.getElementById('copyImageBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', async () => {
      const copied = await copyImageToClipboard();
      showToast(copied ? 'Image copied to clipboard.' : 'Clipboard unavailable — image downloaded instead.');
    });
  });

  document.getElementById('shareBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', shareImage);
  });
</script>
