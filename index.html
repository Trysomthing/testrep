<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Countdown</title>
<style>
  :root{
    --bg-1:#0a0118;
    --bg-2:#1a0538;
    --accent-1:#a855f7;
    --accent-2:#ec4899;
    --accent-3:#38bdf8;
    --text:#f5f3ff;
    --muted:#b9a9d6;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
  }

  body{
    font-family:'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(168,85,247,0.35), transparent 55%),
      radial-gradient(ellipse at 80% 30%, rgba(236,72,153,0.30), transparent 55%),
      radial-gradient(ellipse at 50% 85%, rgba(56,189,248,0.25), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    position:relative;
  }

  /* floating orbs */
  .orb{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.5;
    pointer-events:none;
    animation:float 18s ease-in-out infinite;
  }
  .orb1{
    width:340px; height:340px;
    background:var(--accent-1);
    top:-80px; left:-80px;
    animation-delay:0s;
  }
  .orb2{
    width:280px; height:280px;
    background:var(--accent-3);
    bottom:-60px; right:-60px;
    animation-delay:-6s;
  }
  .orb3{
    width:220px; height:220px;
    background:var(--accent-2);
    top:40%; right:10%;
    animation-delay:-12s;
  }

  @keyframes float{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(30px,-40px) scale(1.08); }
    66%{ transform:translate(-25px,25px) scale(0.95); }
  }

  /* subtle starfield */
  .stars{
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 140px 80px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 90px 160px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 220px 40px, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 260px 190px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 320px 120px, rgba(255,255,255,0.4), transparent);
    background-repeat:repeat;
    background-size:360px 220px;
    opacity:0.6;
    pointer-events:none;
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:920px;
    padding:32px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(24px, 5vw, 48px);
    text-align:center;
  }

  .hug{
    width:clamp(120px, 22vw, 190px);
    filter:drop-shadow(0 10px 26px rgba(236,72,153,0.35));
    animation:bob 6s ease-in-out infinite;
  }

  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .heart{
    transform-origin:120px 52px;
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.14); }
  }

  .eyebrow{
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:clamp(11px, 1.6vw, 13px);
    color:var(--muted);
    font-weight:600;
  }

  h1{
    font-size:clamp(28px, 5.5vw, 56px);
    font-weight:800;
    line-height:1.1;
    background:linear-gradient(90deg, #fff, var(--accent-3) 45%, var(--accent-2) 75%, var(--accent-1));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:-0.02em;
  }

  .subdate{
    color:var(--muted);
    font-size:clamp(13px, 2vw, 16px);
    font-weight:500;
  }
  .subdate span{
    color:var(--text);
    font-weight:700;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:clamp(10px, 2.4vw, 22px);
    width:100%;
  }

  .card{
    position:relative;
    background:rgba(255,255,255,0.055);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:clamp(16px, 2.5vw, 26px);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:clamp(14px, 3.4vw, 30px) clamp(4px, 2vw, 10px);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.15);
    overflow:hidden;
    transition:transform .4s ease;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, rgba(255,255,255,0.12), transparent 40%);
    pointer-events:none;
  }

  .card:hover{ transform:translateY(-4px); }

  .num{
    font-size:clamp(30px, 8.5vw, 72px);
    font-weight:800;
    font-variant-numeric:tabular-nums;
    line-height:1;
    background:linear-gradient(180deg, #ffffff, var(--accent-3) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(168,85,247,0.35);
    display:inline-block;
    min-width:1.6ch;
  }

  .label{
    margin-top:clamp(4px,1.2vw,10px);
    font-size:clamp(9px, 1.8vw, 13px);
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
  }

  .colon-wrap{ display:none; }

  .progress-wrap{
    width:100%;
    max-width:520px;
    height:6px;
    border-radius:999px;
    background:rgba(255,255,255,0.1);
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
  }
  .progress-bar{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent-1), var(--accent-3), var(--accent-2));
    background-size:200% 100%;
    animation:sheen 3s linear infinite;
    transition:width 1s linear;
  }
  @keyframes sheen{
    0%{ background-position:0% 0%; }
    100%{ background-position:200% 0%; }
  }

  .done{
    font-size:clamp(24px, 5vw, 44px);
    font-weight:800;
    background:linear-gradient(90deg, var(--accent-3), var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    display:none;
  }

  .cal-wrap{
    position:relative;
  }

  .cal-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border:none;
    border-radius:999px;
    font-family:inherit;
    font-size:clamp(13px, 1.8vw, 15px);
    font-weight:700;
    letter-spacing:0.02em;
    color:#0a0118;
    background:linear-gradient(90deg, var(--accent-3), var(--accent-1), var(--accent-2));
    background-size:200% 100%;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(168,85,247,0.4);
    transition:transform .25s ease, box-shadow .25s ease, background-position .4s ease;
  }
  .cal-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 36px rgba(236,72,153,0.5);
    background-position:100% 0%;
  }
  .cal-btn:active{ transform:translateY(-1px); }
  .cal-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .cal-menu{
    position:absolute;
    top:calc(100% + 12px);
    left:50%;
    transform:translateX(-50%) translateY(-6px);
    min-width:230px;
    background:rgba(17,9,34,0.97);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:16px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 16px 40px rgba(0,0,0,0.45);
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:10;
  }
  .cal-menu.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }

  .cal-menu.flip-up{
    top:auto;
    bottom:calc(100% + 12px);
    transform:translateX(-50%) translateY(6px);
  }
  .cal-menu.flip-up.open{
    transform:translateX(-50%) translateY(0);
  }

  .cal-option{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:11px 14px;
    border:none;
    border-radius:10px;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    text-align:left;
    text-decoration:none;
    cursor:pointer;
    transition:background .15s ease;
  }
  .cal-option:hover{ background:rgba(255,255,255,0.09); }
  .cal-option svg{ width:16px; height:16px; flex-shrink:0; color:var(--muted); }

  .cal-divider{
    height:1px;
    margin:4px 6px;
    background:rgba(255,255,255,0.12);
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(12px);
    max-width:min(90vw, 360px);
    padding:12px 18px;
    background:rgba(20,10,40,0.92);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:12px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 16px 40px rgba(0,0,0,0.45);
    color:var(--text);
    font-size:13.5px;
    font-weight:600;
    text-align:center;
    line-height:1.4;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .export-wrap{
    position:relative;
  }

  .export-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:14px 26px;
    border:1px solid rgba(255,255,255,0.22);
    border-radius:999px;
    font-family:inherit;
    font-size:clamp(13px, 1.8vw, 15px);
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--text);
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    cursor:pointer;
    transition:transform .25s ease, background .25s ease;
  }
  .export-btn:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,0.14);
  }
  .export-btn:active{ transform:translateY(-1px); }
  .export-btn:disabled{ opacity:0.6; cursor:wait; transform:none; }
  .export-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .cta-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  .exporting .cal-wrap,
  .exporting .export-wrap,
  .exporting footer,
  .exporting .toast{
    visibility:hidden !important;
  }
  .exporting .card{
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    background:rgba(40,20,70,0.6) !important;
  }
  .exporting .cal-menu{
    display:none !important;
  }

  footer{
    position:absolute;
    bottom:16px;
    left:0; right:0;
    text-align:center;
    font-size:11px;
    color:rgba(185,169,214,0.55);
    letter-spacing:0.08em;
    z-index:2;
  }

  @media (max-width: 480px){
    .grid{ gap:8px; }
    .card{ border-radius:16px; }
  }

  @media (prefers-reduced-motion: reduce){
    .orb{ animation:none; }
    .progress-bar{ animation:none; }
    .hug{ animation:none; }
    .heart{ animation:none; }
  }
</style>
</head>
<body>

  <div class="stars"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="stage">
    <svg class="hug" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" aria-label="Illustration of a couple hugging">
      <defs>
        <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <linearGradient id="gradB" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ec4899"/>
          <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ec4899" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="120" cy="152" rx="98" ry="55" fill="url(#glow)"/>

      <!-- left figure -->
      <path d="M60,206 C54,150 59,118 78,107 C69,94 71,77 90,71 C96,67 109,70 113,85 C119,101 111,121 119,141 C127,159 121,182 119,206 Z" fill="url(#gradA)"/>
      <path d="M108,121 C121,112 139,113 149,123 C155,129 153,139 145,141 C132,144 116,137 108,129 Z" fill="url(#gradA)"/>
      <circle cx="95" cy="65" r="21" fill="url(#gradA)"/>

      <!-- right figure -->
      <path d="M180,206 C186,150 181,118 162,107 C171,94 169,77 150,71 C144,67 131,70 127,85 C121,101 129,121 121,141 C113,159 119,182 121,206 Z" fill="url(#gradB)"/>
      <path d="M132,121 C119,112 101,113 91,123 C85,129 87,139 95,141 C108,144 124,137 132,129 Z" fill="url(#gradB)"/>
      <circle cx="145" cy="65" r="21" fill="url(#gradB)"/>

      <!-- heart -->
      <path class="heart" d="M120,38 C114,28 97,30 97,45 C97,58 120,73 120,73 C120,73 143,58 143,45 C143,30 126,28 120,38 Z" fill="#ec4899"/>
    </svg>

    <div class="eyebrow">Countdown</div>
    <h1 id="title">Something big is coming</h1>
    <div class="subdate">Target &mdash; <span id="targetLabel"></span></div>

    <div class="grid" id="grid">
      <div class="card">
        <div class="num" id="days">00</div>
        <div class="label">Days</div>
      </div>
      <div class="card">
        <div class="num" id="hours">00</div>
        <div class="label">Hours</div>
      </div>
      <div class="card">
        <div class="num" id="minutes">00</div>
        <div class="label">Minutes</div>
      </div>
      <div class="card">
        <div class="num" id="seconds">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <div class="done" id="doneMsg">🎉 It's here!</div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="cta-row">
      <div class="cal-wrap">
        <button class="cal-btn" id="calBtn" type="button" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="3"></rect>
            <path d="M16 3v4M8 3v4M3 10h18"></path>
          </svg>
          Add to Calendar
        </button>

        <div class="cal-menu" id="calMenu">
          <a class="cal-option" id="googleCalLink" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
            Google Calendar
          </a>
          <button class="cal-option" id="icsBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"></path><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"></path></svg>
            Apple / Outlook (.ics)
          </button>
        </div>
      </div>

      <div class="export-wrap">
        <button class="export-btn" id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <circle cx="9" cy="9" r="2"></circle>
            <path d="M21 15l-5-5-4 4-3-3-6 6"></path>
          </svg>
          <span id="exportBtnLabel">Export</span>
        </button>

        <div class="cal-menu" id="exportMenu">
          <button class="cal-option" id="exportPngBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5-4 4-3-3-6 6"></path></svg>
            Save as Image (PNG)
          </button>
          <button class="cal-option" id="exportGifBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10v4M11 10h1.5a1.5 1.5 0 010 3H11v-3zM17 10a2 2 0 100 4"></path></svg>
            Save as GIF (animated)
          </button>
          <div class="cal-divider"></div>
          <button class="cal-option" id="copyImageBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a2 2 0 00-2-2H6a2 2 0 00-2 2v10a2 2 0 002 2h3"></path></svg>
            <span id="copyImageBtnLabel">Copy Image to Clipboard</span>
          </button>
          <button class="cal-option" id="shareBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 10.6l6.8-3.9M8.6 13.4l6.8 3.9"></path></svg>
            <span id="shareBtnLabel">Share… (WhatsApp, Telegram, Email)</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>Countdown &middot; local time</footer>

<script>
  // ---- Configure your countdown here ----
  const TARGET_DATE = new Date(2026, 6, 29, 16, 0, 0); // July 29, 2026, 16:00 local time
  const START_DATE  = new Date(2026, 6, 16, 0, 0, 0);  // for progress bar baseline

  const EVENT_TITLE       = document.getElementById('title').textContent;
  const EVENT_DESCRIPTION = 'Countdown event, created from the countdown page.';
  const EVENT_LOCATION    = '';
  const EVENT_DURATION_HOURS = 1;
  // ----------------------------------------

  const els = {
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
    grid: document.getElementById('grid'),
    done: document.getElementById('doneMsg'),
    progress: document.getElementById('progressBar'),
    targetLabel: document.getElementById('targetLabel'),
  };

  els.targetLabel.textContent = TARGET_DATE.toLocaleString(undefined, {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });

  const pad = n => String(n).padStart(2, '0');

  function tick(){
    const now = new Date();
    const diff = TARGET_DATE - now;

    if (diff <= 0){
      els.days.textContent = '00';
      els.hours.textContent = '00';
      els.minutes.textContent = '00';
      els.seconds.textContent = '00';
      els.progress.style.width = '100%';
      els.grid.style.opacity = '0.35';
      els.done.style.display = 'block';
      clearInterval(timer);
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const d = Math.floor(totalSeconds / 86400);
    const h = Math.floor((totalSeconds % 86400) / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;

    els.days.textContent = pad(d);
    els.hours.textContent = pad(h);
    els.minutes.textContent = pad(m);
    els.seconds.textContent = pad(s);

    const total = TARGET_DATE - START_DATE;
    const elapsed = now - START_DATE;
    const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
    els.progress.style.width = pct + '%';
  }

  tick();
  const timer = setInterval(tick, 1000);

  // ---- Add to Calendar ----
  const eventStart = TARGET_DATE;
  const eventEnd = new Date(TARGET_DATE.getTime() + EVENT_DURATION_HOURS * 3600 * 1000);

  function pad2(n){ return String(n).padStart(2, '0'); }

  function toCalDateString(d){
    return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
  }

  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

  const googleCalUrl =
    'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    `&text=${encodeURIComponent(EVENT_TITLE)}` +
    `&dates=${toCalDateString(eventStart)}/${toCalDateString(eventEnd)}` +
    `&details=${encodeURIComponent(EVENT_DESCRIPTION)}` +
    `&location=${encodeURIComponent(EVENT_LOCATION)}` +
    `&ctz=${encodeURIComponent(timeZone)}`;

  document.getElementById('googleCalLink').href = googleCalUrl;

  function downloadICS(){
    const dtstamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const uid = `countdown-${eventStart.getTime()}@countdown-app`;

    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Countdown Page//EN',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${dtstamp}`,
      `DTSTART:${toCalDateString(eventStart)}`,
      `DTEND:${toCalDateString(eventEnd)}`,
      `SUMMARY:${EVENT_TITLE}`,
      `DESCRIPTION:${EVENT_DESCRIPTION}`,
    ];
    if (EVENT_LOCATION) lines.push(`LOCATION:${EVENT_LOCATION}`);
    lines.push('END:VEVENT', 'END:VCALENDAR');

    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'event.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const calBtn = document.getElementById('calBtn');
  const calMenu = document.getElementById('calMenu');

  function positionMenu(menuEl){
    menuEl.classList.remove('flip-up');
    const rect = menuEl.getBoundingClientRect();
    if (rect.bottom > window.innerHeight){
      menuEl.classList.add('flip-up');
    }
  }

  calBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = calMenu.classList.toggle('open');
    calBtn.setAttribute('aria-expanded', String(isOpen));
    if (isOpen) positionMenu(calMenu);
  });

  calMenu.addEventListener('click', (e) => e.stopPropagation());

  document.addEventListener('click', () => {
    calMenu.classList.remove('open');
    calBtn.setAttribute('aria-expanded', 'false');
  });

  document.getElementById('icsBtn').addEventListener('click', () => {
    downloadICS();
    calMenu.classList.remove('open');
  });

  // ---- Export as Image / GIF ----
  // Renders the page (minus the buttons) to a canvas via an SVG foreignObject,
  // so exporting needs no external library or network access.

  function pageStyleText(){
    return document.querySelector('style').textContent;
  }

  function nodeToImage(node){
    return new Promise((resolve, reject) => {
      const rect = node.getBoundingClientRect();
      const width = Math.ceil(rect.width);
      const height = Math.ceil(Math.max(rect.height, document.documentElement.scrollHeight));
      const clone = node.cloneNode(true);
      const html =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '">' +
          '<foreignObject width="100%" height="100%">' +
            '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + width + 'px;height:' + height + 'px;">' +
              '<style>' + pageStyleText() + '</style>' +
              new XMLSerializer().serializeToString(clone) +
            '</div>' +
          '</foreignObject>' +
        '</svg>';
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(html);
      const img = new Image();
      img.onload = () => resolve({ img, width, height });
      img.onerror = reject;
      img.src = url;
    });
  }

  async function captureToCanvas(scale){
    document.body.classList.add('exporting');
    try {
      const { img, width, height } = await nodeToImage(document.body);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#160a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas;
    } finally {
      document.body.classList.remove('exporting');
    }
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function buildPngBlob(scale){
    return captureToCanvas(scale).then((canvas) =>
      new Promise((resolve) => canvas.toBlob(resolve, 'image/png'))
    );
  }

  async function exportAsPNG(){
    const blob = await buildPngBlob(2);
    downloadBlob(blob, 'countdown.png');
  }

  // ---- Toast feedback ----
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function showToast(message, ms){
    toastEl.textContent = message;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 3200);
  }

  // ---- Copy Image to Clipboard ----
  async function copyImageToClipboard(){
    const blob = await buildPngBlob(2);
    if (navigator.clipboard && window.ClipboardItem){
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        return true;
      } catch (err){
        // fall through to download fallback below
      }
    }
    downloadBlob(blob, 'countdown.png');
    return false;
  }

  // ---- Share to another app (native share sheet when available) ----
  async function shareImage(){
    const blob = await buildPngBlob(2);
    const file = new File([blob], 'countdown.png', { type: 'image/png' });
    const shareData = {
      files: [file],
      title: EVENT_TITLE,
      text: `Countdown to ${EVENT_TITLE} — ${els.targetLabel.textContent}`,
    };

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share(shareData);
        return;
      } catch (err){
        if (err && err.name === 'AbortError') return; // user cancelled the share sheet
        // real failure: fall through to clipboard fallback
      }
    }

    const copied = await copyImageToClipboard();
    showToast(
      copied
        ? 'Sharing isn’t available in this browser — image copied. Paste it into WhatsApp, Telegram, or an email.'
        : 'Sharing isn’t available in this browser — image downloaded instead.'
    );
  }

  // -- Minimal self-contained GIF89a encoder --
  // Uses a fixed 256-color palette (3/3/2-bit RGB buckets) so every frame
  // quantizes deterministically, plus a standard dictionary-based LZW
  // encoder (GIF-flavored). No external library or network access needed.

  function buildGifPalette(){
    const palette = new Uint8Array(256 * 3);
    for (let r3 = 0; r3 < 8; r3++){
      for (let g3 = 0; g3 < 8; g3++){
        for (let b2 = 0; b2 < 4; b2++){
          const idx = (r3 << 5) | (g3 << 2) | b2;
          palette[idx * 3 + 0] = Math.min(255, r3 * 32 + 16);
          palette[idx * 3 + 1] = Math.min(255, g3 * 32 + 16);
          palette[idx * 3 + 2] = Math.min(255, b2 * 64 + 32);
        }
      }
    }
    return palette;
  }

  function quantizePixel(r, g, b){
    return ((r >> 5) << 5) | ((g >> 5) << 2) | (b >> 6);
  }

  class GifBitWriter{
    constructor(){ this.bytes = []; this.buffer = 0; this.bitCount = 0; }
    writeCode(code, size){
      this.buffer |= (code << this.bitCount);
      this.bitCount += size;
      while (this.bitCount >= 8){
        this.bytes.push(this.buffer & 0xFF);
        this.buffer >>= 8;
        this.bitCount -= 8;
      }
    }
    flush(){
      if (this.bitCount > 0){
        this.bytes.push(this.buffer & 0xFF);
        this.buffer = 0;
        this.bitCount = 0;
      }
    }
  }

  function lzwEncode(indices){
    // Standard dictionary-based GIF LZW encoder (8-bit palette codes).
    // Encoder and decoder build the identical dictionary from the same
    // rules, so the bitstream is self-synchronizing by construction.
    const CLEAR = 256, EOI = 257;
    const writer = new GifBitWriter();
    let codeSize, nextCode, dict;

    function resetDict(){
      dict = new Map();
      nextCode = 258;
      codeSize = 9;
    }

    resetDict();
    writer.writeCode(CLEAR, codeSize);

    let prefix = -1;
    for (let i = 0; i < indices.length; i++){
      const k = indices[i];
      if (prefix === -1){ prefix = k; continue; }

      const key = prefix * 256 + k;
      if (dict.has(key)){
        prefix = dict.get(key);
        continue;
      }

      writer.writeCode(prefix, codeSize);
      if (nextCode < 4096){
        dict.set(key, nextCode);
        nextCode++;
        if (nextCode > (1 << codeSize) && codeSize < 12){
          codeSize++;
        }
      } else {
        writer.writeCode(CLEAR, codeSize);
        resetDict();
      }
      prefix = k;
    }
    if (prefix !== -1) writer.writeCode(prefix, codeSize);
    writer.writeCode(EOI, codeSize);
    writer.flush();
    return writer.bytes;
  }

  function packSubBlocks(bytes){
    const out = [];
    let i = 0;
    while (i < bytes.length){
      const len = Math.min(255, bytes.length - i);
      out.push(len);
      for (let j = 0; j < len; j++) out.push(bytes[i + j]);
      i += len;
    }
    out.push(0);
    return out;
  }

  function buildGif(frames, delayCentiseconds){
    const width = frames[0].width, height = frames[0].height;
    const palette = buildGifPalette();
    const bytes = [];

    const pushStr = (s) => { for (let i = 0; i < s.length; i++) bytes.push(s.charCodeAt(i)); };
    const push16 = (n) => { bytes.push(n & 0xFF, (n >> 8) & 0xFF); };

    pushStr('GIF89a');
    push16(width);
    push16(height);
    bytes.push(0xF7, 0, 0);
    for (let i = 0; i < palette.length; i++) bytes.push(palette[i]);

    bytes.push(0x21, 0xFF, 0x0B);
    pushStr('NETSCAPE2.0');
    bytes.push(0x03, 0x01, 0x00, 0x00, 0x00);

    for (const frame of frames){
      const indices = new Uint8Array(frame.width * frame.height);
      for (let p = 0; p < indices.length; p++){
        indices[p] = quantizePixel(frame.data[p * 4], frame.data[p * 4 + 1], frame.data[p * 4 + 2]);
      }

      bytes.push(0x21, 0xF9, 0x04, 0x00);
      push16(delayCentiseconds);
      bytes.push(0x00, 0x00);

      bytes.push(0x2C);
      push16(0); push16(0);
      push16(frame.width); push16(frame.height);
      bytes.push(0x00);

      bytes.push(8);
      const packed = packSubBlocks(lzwEncode(indices));
      for (const b of packed) bytes.push(b);
    }

    bytes.push(0x3B);
    return new Uint8Array(bytes);
  }

  async function captureGifFrames(frameCount, intervalMs, maxWidth){
    const frames = [];
    for (let i = 0; i < frameCount; i++){
      const canvas = await captureToCanvas(1);
      let source = canvas;
      if (canvas.width > maxWidth){
        const ratio = maxWidth / canvas.width;
        const small = document.createElement('canvas');
        small.width = maxWidth;
        small.height = Math.max(1, Math.round(canvas.height * ratio));
        small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
        source = small;
      }
      const ctx = source.getContext('2d');
      const data = ctx.getImageData(0, 0, source.width, source.height);
      frames.push({ data: data.data, width: source.width, height: source.height });
      if (i < frameCount - 1) await new Promise((r) => setTimeout(r, intervalMs));
    }
    return frames;
  }

  async function exportAsGIF(){
    const frames = await captureGifFrames(5, 450, 360);
    const gifBytes = buildGif(frames, 45);
    downloadBlob(new Blob([gifBytes], { type: 'image/gif' }), 'countdown.gif');
  }

  const exportBtn = document.getElementById('exportBtn');
  const exportMenu = document.getElementById('exportMenu');
  const exportBtnLabel = document.getElementById('exportBtnLabel');

  exportBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = exportMenu.classList.toggle('open');
    exportBtn.setAttribute('aria-expanded', String(isOpen));
    calMenu.classList.remove('open');
    if (isOpen) positionMenu(exportMenu);
  });

  exportMenu.addEventListener('click', (e) => e.stopPropagation());

  document.addEventListener('click', () => {
    exportMenu.classList.remove('open');
    exportBtn.setAttribute('aria-expanded', 'false');
  });

  calBtn.addEventListener('click', () => exportMenu.classList.remove('open'));

  async function withBusyExport(label, fn){
    exportMenu.classList.remove('open');
    exportBtn.disabled = true;
    const prevLabel = exportBtnLabel.textContent;
    exportBtnLabel.textContent = label;
    try {
      await fn();
    } finally {
      exportBtn.disabled = false;
      exportBtnLabel.textContent = prevLabel;
    }
  }

  document.getElementById('exportPngBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', exportAsPNG);
  });

  document.getElementById('exportGifBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', exportAsGIF);
  });

  document.getElementById('copyImageBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', async () => {
      const copied = await copyImageToClipboard();
      showToast(copied ? 'Image copied to clipboard.' : 'Clipboard unavailable — image downloaded instead.');
    });
  });

  document.getElementById('shareBtn').addEventListener('click', () => {
    withBusyExport('Exporting…', shareImage);
  });
</script>
</body>
